services:
  # PostgreSQL (로컬 개발용)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streampocket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 백엔드 (로컬 개발: 소스 마운트 + 핫리로드)
  be:
    build:
      context: .             # be/ 폴더 기준
      target: builder        # devDependencies 포함된 빌드 스테이지 사용
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      # .env가 운영 복사본(NODE_ENV=production)이어도 로컬 컨테이너는 항상 개발 모드
      # (인증번호 알림톡 실발송 방지 — dev 모드는 콘솔 출력. 실발송 테스트 시에만 잠시 production으로)
      NODE_ENV: development
    volumes:
      - ./src:/app/src       # 소스 변경 시 핫리로드
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
