paths:
  /auth/login:
    post:
      summary: 관리자 로그인
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: admin@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: 로그인 성공 (JWT 반환)
        '401':
          description: 인증 실패
        '403':
          description: 비활성화된 계정 (비밀번호가 맞을 때만 이 응답)
  /auth/me:
    get:
      summary: 로그인한 관리자의 역할·페이지 권한
      description: |
        요청마다 DB에서 다시 조회한 값이라 사장이 권한을 바꾸면 즉시 반영된다.
        owner는 permissions가 빈 배열이며 모든 페이지에 접근할 수 있다.
        모든 관리자 API는 같은 방식으로 검사한다 — 비활성·삭제 계정 401, 페이지 권한 없음 403.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      role:
                        type: string
                        enum: [owner, staff]
                      permissions:
                        type: array
                        items:
                          type: string
                        example: [orders, applications]
        '401':
          description: 토큰 없음·무효, 또는 비활성·삭제된 계정
