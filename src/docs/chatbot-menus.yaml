paths:
  /steam/admin/chatbot-menus:
    get:
      summary: 챗봇 메뉴 목록 + 웰컴 인사말 조회
      description: 카카오 챗봇 메뉴 항목 전체와 웰컴 인사말을 반환한다.
      tags: [ChatbotMenus]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 웰컴 인사말 + 메뉴 항목 목록
        '401':
          description: 인증 실패
    post:
      summary: 챗봇 메뉴 항목 생성
      tags: [ChatbotMenus]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, body]
              properties:
                label:
                  type: string
                  description: 버튼 텍스트(이모지 포함) — 챗봇 발화 매칭 키
                body:
                  type: string
                  description: 응답 본문
                imageUrl:
                  type: string
                  nullable: true
                  description: 응답 이미지 URL(선택)
                buttons:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required: [label, url]
                    properties:
                      label: { type: string }
                      url: { type: string }
                isActive:
                  type: boolean
      responses:
        '201':
          description: 생성된 메뉴 항목
        '401':
          description: 인증 실패

  /steam/admin/chatbot-menus/welcome:
    put:
      summary: 챗봇 웰컴 인사말 수정
      tags: [ChatbotMenus]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                welcomeMessage:
                  type: string
                  nullable: true
      responses:
        '200':
          description: 수정된 웰컴 인사말
        '401':
          description: 인증 실패

  /steam/admin/chatbot-menus/reorder:
    put:
      summary: 챗봇 메뉴 항목 순서 변경
      tags: [ChatbotMenus]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedIds]
              properties:
                orderedIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: 노출 순서대로 정렬된 메뉴 항목 id 배열
      responses:
        '200':
          description: 재정렬된 메뉴 항목 목록
        '401':
          description: 인증 실패

  /steam/admin/chatbot-menus/image-upload-url:
    post:
      summary: 챗봇 메뉴 이미지 업로드용 presigned URL 발급
      tags: [ChatbotMenus]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentLength]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                contentLength:
                  type: integer
                  description: 파일 크기(byte), 최대 5MB
      responses:
        '200':
          description: uploadUrl(S3 PUT) + objectUrl
        '401':
          description: 인증 실패

  /steam/admin/chatbot-menus/{id}:
    patch:
      summary: 챗봇 메뉴 항목 수정
      tags: [ChatbotMenus]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                body: { type: string }
                imageUrl: { type: string, nullable: true }
                buttons:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    properties:
                      label: { type: string }
                      url: { type: string }
                isActive: { type: boolean }
      responses:
        '200':
          description: 수정된 메뉴 항목
        '401':
          description: 인증 실패
        '404':
          description: 항목 없음
    delete:
      summary: 챗봇 메뉴 항목 삭제
      tags: [ChatbotMenus]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 삭제 완료
        '401':
          description: 인증 실패
        '404':
          description: 항목 없음
