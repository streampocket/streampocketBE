paths:
  /gcoin/products:
    get:
      tags: [GCOIN 상품 (공개)]
      summary: 판매 상품 목록 조회 (숨김 제외)
      description: gcoin 사이트용 공개 API. 판매중·품절 상품을 진열 순서(sortOrder asc)로 반환한다.
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GcoinProduct'

  /gcoin/products/{id}:
    get:
      tags: [GCOIN 상품 (공개)]
      summary: 상품 상세 조회
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 상품 상세
        '404':
          description: 상품 없음 (숨김/삭제 포함)

  /gcoin/admin/products:
    post:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 등록
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, salePrice]
              properties:
                name: { type: string, maxLength: 255, description: 상품 제목 }
                category:
                  type: string
                  enum: [gcoin, item]
                  default: gcoin
                  description: 카테고리 (gcoin=지코인, item=아이템)
                gcoinAmount:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: 지코인 수량 — gcoin 카테고리는 필수, item 카테고리는 null 저장
                salePrice: { type: integer, minimum: 0, description: 판매가 }
                listPrice:
                  type: integer
                  nullable: true
                  description: 원화 정가 (선택 — 입력 시 판매가보다 커야 하며 할인 표시에 사용)
                listPriceUsd:
                  type: number
                  nullable: true
                  description: 달러 정가 (gcoin 카테고리 전용, item은 null 강제) — 조회 시 최신 환율로 원화 환산되어 listPrice로 응답. 환산액이 판매가보다 커야 함
                description: { type: string, nullable: true, description: 상세 설명(마크다운) }
                imageUrl: { type: string, nullable: true, maxLength: 500 }
                sortOrder:
                  type: integer
                  minimum: 0
                  description: 진열 순서 (미입력 시 맨 뒤 자동 배치)
                status:
                  type: string
                  enum: [on_sale, hidden, sold_out]
                  default: hidden
      responses:
        '201':
          description: 생성됨
        '400':
          description: 정가가 판매가 이하 / 지코인 상품에 수량 누락
        '401':
          description: 인증 실패
    get:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 목록 조회 (필터·검색·페이지네이션)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [on_sale, hidden, sold_out] }
        - in: query
          name: category
          schema: { type: string, enum: [gcoin, item] }
        - in: query
          name: search
          schema: { type: string }
          description: 상품명 부분 일치 검색
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: '{ data, total, page, pageSize, totalPages }'

  /gcoin/admin/exchange-rate:
    get:
      tags: [GCOIN 상품 (관리자)]
      summary: 현재 USD→KRW 환율 조회 (폼 환산 미리보기용)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: '{ data: { rate, fetchedAt } | null } — 아직 갱신된 적 없으면 null'

  /gcoin/admin/exchange-rate/refresh:
    post:
      tags: [GCOIN 상품 (관리자)]
      summary: 환율 즉시 갱신 (open.er-api.com 호출, 수동 트리거)
      description: 크론이 매일 09/15/21시 KST에 자동 갱신하지만, 초기 세팅이나 장애 복구 시 수동 실행할 수 있다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: '{ data: { rate, fetchedAt } }'

  /gcoin/admin/products/uploads/presigned-url:
    post:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 이미지 업로드용 S3 presigned URL 발급
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentLength]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                contentLength: { type: integer, description: 바이트 (최대 5MB) }
      responses:
        '200':
          description: '{ uploadUrl, objectUrl, key }'

  /gcoin/admin/products/{id}:
    get:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 상세 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 상품 상세 }
        '404': { description: 상품 없음 }
    patch:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 수정 (부분 수정, status 포함)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 등록 바디와 동일 필드, 전부 선택
      responses:
        '200': { description: 수정됨 }
        '400': { description: 정가가 판매가 이하 / 지코인 상품에 수량 누락 }
        '404': { description: 상품 없음 }
    delete:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 삭제 (soft delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 상품 없음 }

components:
  schemas:
    GcoinProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, enum: [gcoin, item] }
        gcoinAmount: { type: integer, nullable: true }
        salePrice: { type: integer }
        listPrice:
          type: integer
          nullable: true
          description: 원화 정가 — 달러 정가(listPriceUsd)가 있으면 환율 환산값(100원 단위 반올림), 환산액이 판매가 이하이거나 환율 미확보면 null
        listPriceUsd: { type: number, nullable: true, description: 달러 정가 원본 }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        sortOrder: { type: integer }
        purchaseCount: { type: integer }
        status: { type: string, enum: [on_sale, hidden, sold_out] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
