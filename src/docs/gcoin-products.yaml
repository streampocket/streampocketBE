paths:
  /gcoin/products:
    get:
      tags: [GCOIN 상품 (공개)]
      summary: 판매 상품 목록 조회 (숨김 제외)
      description: gcoin 사이트용 공개 API. 판매중·품절 상품을 진열 순서(sortOrder asc)로 반환한다.
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GcoinProduct'

  /gcoin/products/{id}:
    get:
      tags: [GCOIN 상품 (공개)]
      summary: 상품 상세 조회
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 상품 상세
        '404':
          description: 상품 없음 (숨김/삭제 포함)

  /gcoin/admin/products:
    post:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 등록
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gcoinAmount, salePrice]
              properties:
                name: { type: string, maxLength: 255, description: 상품 제목 }
                gcoinAmount: { type: integer, minimum: 1, description: 지코인 수량 }
                salePrice: { type: integer, minimum: 0, description: 판매가 }
                listPrice:
                  type: integer
                  nullable: true
                  description: 정가 (선택 — 입력 시 판매가보다 커야 하며 할인 표시에 사용)
                description: { type: string, nullable: true, description: 상세 설명(마크다운) }
                imageUrl: { type: string, nullable: true, maxLength: 500 }
                sortOrder:
                  type: integer
                  minimum: 0
                  description: 진열 순서 (미입력 시 맨 뒤 자동 배치)
                status:
                  type: string
                  enum: [on_sale, hidden, sold_out]
                  default: hidden
      responses:
        '201':
          description: 생성됨
        '400':
          description: 정가가 판매가 이하
        '401':
          description: 인증 실패
    get:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 목록 조회 (필터·검색·페이지네이션)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [on_sale, hidden, sold_out] }
        - in: query
          name: search
          schema: { type: string }
          description: 상품명 부분 일치 검색
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: '{ data, total, page, pageSize, totalPages }'

  /gcoin/admin/products/uploads/presigned-url:
    post:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 이미지 업로드용 S3 presigned URL 발급
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentLength]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                contentLength: { type: integer, description: 바이트 (최대 5MB) }
      responses:
        '200':
          description: '{ uploadUrl, objectUrl, key }'

  /gcoin/admin/products/{id}:
    get:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 상세 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 상품 상세 }
        '404': { description: 상품 없음 }
    patch:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 수정 (부분 수정, status 포함)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 등록 바디와 동일 필드, 전부 선택
      responses:
        '200': { description: 수정됨 }
        '400': { description: 정가가 판매가 이하 }
        '404': { description: 상품 없음 }
    delete:
      tags: [GCOIN 상품 (관리자)]
      summary: 상품 삭제 (soft delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 상품 없음 }

components:
  schemas:
    GcoinProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gcoinAmount: { type: integer }
        salePrice: { type: integer }
        listPrice: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        sortOrder: { type: integer }
        purchaseCount: { type: integer }
        status: { type: string, enum: [on_sale, hidden, sold_out] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
