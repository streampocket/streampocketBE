paths:
  /own/admin/applications:
    get:
      summary: 파티 참여 신청 목록 조회 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, cancelled, expired]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 신청 목록 (페이지네이션 포함)

  /own/admin/applications/{id}:
    get:
      summary: 신청 상세 조회 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 신청 상세
        '404':
          description: 신청 없음

  /own/admin/applications/{id}/approve:
    post:
      summary: 신청 승인 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 승인 완료. status=confirmed, startedAt/expiresAt 셋팅
        '404':
          description: 신청 없음
        '409':
          description: 대기 중인 신청이 아님

  /own/admin/applications/{id}/reject:
    post:
      summary: 신청 거절 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 거절 완료. status=cancelled, 슬롯 원복
        '404':
          description: 신청 없음
        '409':
          description: 대기 중인 신청이 아님
