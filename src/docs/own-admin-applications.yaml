paths:
  /own/admin/applications/hourly:
    get:
      summary: 파티 신청 시간대 분포 (관리자)
      description: |
        신청이 들어온 시각을 **KST 시(0~23)** 단위로 집계한다. 분·초는 보지 않는다.

        **기준은 `party_applications.created_at`(이용자가 신청 버튼을 누른 시각)이다.**
        파티 주문(`steam_order_items.paid_at`)은 관리자가 승인한 시각이라 쓰지 않는다 —
        그걸로 집계하면 "고객이 신청한 시간대"가 아니라 "관리자가 승인한 시간대"가 나온다.

        신청 **상태는 거르지 않는다**. 취소·만료됐어도 "그 시간에 들어왔다"는 사실은 변하지 않는다.
        신청이 없는 시간대도 `count: 0`으로 채워 항상 24칸을 돌려준다.
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, example: '2026-07-03' }, description: 'YYYY-MM-DD (KST)' }
        - { in: query, name: to, required: true, schema: { type: string, example: '2026-08-01' }, description: 'YYYY-MM-DD (KST). from보다 빠를 수 없다' }
      responses:
        '200':
          description: 시간대별 신청 건수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          from: { type: string, example: '2026-07-03' }
                          to: { type: string, example: '2026-08-01' }
                      total: { type: integer, example: 903, description: 조회 기간 전체 신청 수 }
                      peakHour:
                        type: integer
                        nullable: true
                        example: 21
                        description: 가장 많이 들어온 시. 신청이 0건이면 null (0시가 피크로 잡히지 않는다)
                      hourly:
                        type: array
                        description: 항상 24개 (0~23시)
                        items:
                          type: object
                          properties:
                            hour: { type: integer, minimum: 0, maximum: 23 }
                            count: { type: integer }
        '400': { description: 날짜 형식 오류 · 시작일이 종료일보다 늦음 }
        '401': { description: 인증 필요 }

  /own/admin/applications:
    get:
      summary: 파티 참여 신청 목록 조회 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, cancelled, expired]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 신청 목록 (페이지네이션 포함)

  /own/admin/applications/{id}:
    get:
      summary: 신청 상세 조회 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            신청 상세 + alimtalkLogs(신청 접수 UJ_2053 이력, 본문 message는 제외) +
            autoAssignPreview({ eligible, reason, account }) +
            dramaAccount({ source, email, password, otpSecret, platform, dueAt, secretMismatch, ambiguous }) +
            product.partyExpiresAt/partyRemainingDays + expiresAtIfApprovedNow.


            **autoAssignPreview.account와 dramaAccount는 계정 아이디·비밀번호·OTP 시크릿을
            평문으로 포함한다** (관리자 전용, 드라마 계정 관리와 같은 정책).


            autoAssignPreview는 **예약이 아니라 매번 다시 계산하는 스냅샷**이다 —
            다른 신청을 먼저 승인해 그 계정이 차면 다음 조회 때 다른 계정이 나온다.
            실제 배정은 승인 트랜잭션 안에서 다시 조회하므로 정확하다.


            dramaAccount는 시크릿이 등록된 건에만 채워진다.
            자동 배정 건은 링크로, 수동 등록 건은 시크릿 평문 역추적으로 계정을 찾는다.


            고객 안내 양식의 이용 기간은 **저장된 expiresAt**을 쓴다 — 만료 크론·OTP 발급 가능 판정·
            유저 마이페이지가 모두 이 값만 보므로, 다시 계산한 값을 쓰면 고객이 보는 기간과 어긋난다.
            차감형(countdown) 파티는 승인 시점에 파티 종료일로 잘려 저장되지만,
            클램프 도입(2026-09) 이전 승인 건은 파티 종료일을 넘는 값이 남아 있고 실제로 그날까지 이용한다.


            **product.partyExpiresAt은 파티 자체가 끝나는 시각**이다(신청자 개인 만료 expiresAt과 다름).
            파티 화면(`/own/admin/products`)과 같은 이름·계산식이며, 아직 아무도 승인되지 않은 파티는 null이다.
            partyRemainingDays는 종료까지 남은 일수(시작 전이면 파티 전체 이용일수).


            **expiresAtIfApprovedNow는 대기(pending) 건에만** 채워진다 — 지금 승인하면 이용이 언제 끝나는지.
            승인 로직과 같은 계산식이라 실제 저장될 값과 일치한다. 확정 건은 expiresAt이 답이므로 null.
        '404':
          description: 신청 없음

  /own/admin/applications/{id}/approve:
    post:
      summary: 신청 승인 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                autoAssign:
                  type: boolean
                  default: false
                  description: |
                    true면 승인 직후 드라마 계정을 자동 배정한다 (계정 정보 전달은 관리자가 안내 양식을 복사해 직접 한다).
                    배정 조건: 파티명↔계정 platform 매핑 일치 · 파티 타입 일치(개인형=정원 1, 공유형=정원 2 이상) ·
                    빈자리 있음 · 계정 마감일 ≥ 이용 만료일.
                    조건에 맞는 계정이 여럿이면 마감일이 빠른 계정부터 소진한다.
                    **배정 실패는 승인을 롤백하지 않는다** — autoAssign 필드로 결과만 알린다.
      responses:
        '200':
          description: |
            승인 완료. status=confirmed, startedAt/expiresAt 셋팅.
            expiresAt은 차감형(countdown) 파티에서 파티 종료일을 넘지 않도록 잘린다.
            응답: data(신청), autoRejected(정원 초과 자동거절 여부),
            partyClosed(이번 승인으로 파티가 모집완료됐는지 — true면 fe가 동일 파티 재생성 여부를 확인),
            productId(파티 id — 재생성 API 호출용, autoRejected 시 null),
            autoAssign({ attempted, assigned, reason }) — 자동 배정 결과.
            reason은 사유 코드(unmapped_party/no_account/already_has_secret/assigned_by_other 등)
            또는 트랜잭션 오류 메시지.
        '404':
          description: 신청 없음
        '409':
          description: 대기 중인 신청이 아님

  /own/admin/applications/{id}/reject:
    post:
      summary: 신청 거절 (관리자)
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 거절 완료. status=cancelled (대기 상태는 슬롯 미점유라 인원 변동 없음)
        '404':
          description: 신청 없음
        '409':
          description: 대기 중인 신청이 아님

  /own/admin/applications/{id}/cancel:
    post:
      summary: 확정 파티원 제거 (관리자)
      description: |
        확정(confirmed)된 파티원을 파티에서 제거한다. 파티 신청을 cancelled로 전이하고
        모집 인원을 1 줄이며, 정원을 채워 모집완료됐던 파티는 모집중으로 되돌린다
        (단 남은 기간 1일 이하이거나 관리자가 수동 마감한 파티는 상태 유지).
        연결된 파티 주문(미반품 건 전부)도 자동 반품 처리된다.
        주문 반품이 실패해도 파티원 제거는 확정되며 orderReturnFailed로 알린다.
        재실행해도 인원이 중복 감소하지 않는다(멱등).
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            제거 완료. data — productId, productName, userName,
            filledSlots/totalSlots(제거 후 인원), partyReopened(모집중 복귀 여부),
            orderReturned(반품된 주문 수), orderReturnFailed(반품 실패 수)
        '404':
          description: 신청 없음
        '409':
          description: 확정 상태가 아님 (이미 취소·만료·대기 중인 신청)
