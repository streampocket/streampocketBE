paths:
  /own/admin/renewals/{id}:
    get:
      summary: 파티 재구매 상세 (관리자)
      description: |
        `id`는 **재구매 id** (신청관리 목록에서 `kind: renewal` 항목의 id).
        대기 건은 `extendedFrom`/`extendedTo`가 "지금 승인하면"의 미리보기다.
        `warnings.accountDueBeforeExpiry` — 배정 계정의 멤버십 마감일이 연장 후 만료보다 빠름(계정 멤버십 연장 필요, 승인은 가능).
        `warnings.memberMissing` — 원 신청에 파티원 메모 연결이 없어 만료일만 늘고 메모는 갱신되지 않음.
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 재구매 상세 (금액·할인·연장 구간·원 신청·알림톡 이력·경고)
        '404':
          description: 재구매 없음
  /own/admin/renewals/{id}/approve:
    post:
      summary: 파티 재구매 승인 (관리자)
      description: |
        원 신청 만료를 연장한다. 연장 시작 = max(현재 만료, 승인 시각) → + 파티 기간.
        만료 크론이 이미 만료 처리했으면 원 신청을 이용 중으로, 파티가 expired면 closed로 되돌린다.
        OTP 발급 횟수를 0으로 초기화하고, 연결된 드라마 파티원 메모의 만료를 맞춘다.
        정원 확인·계정 배정은 하지 않는다(같은 자리를 이어 쓴다).
        주문관리에 `{파티명} ({N}일 재구매)` 파티 주문이 순수익 0원으로 자동 생성된다(실패해도 승인은 유지).
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: renewalId / extendedFrom / extendedTo
        '404':
          description: 재구매 없음
        '409':
          description: 대기 상태 아님 / 원 신청이 이용 중·만료 상태가 아님(파티원 제거됨)
  /own/admin/renewals/{id}/reject:
    post:
      summary: 파티 재구매 거절 (관리자)
      description: 대기 건만. 이 재구매에 쓴 포인트만 반환한다(원 신청은 그대로).
      tags: [AdminApplications]
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 거절된 재구매
        '404':
          description: 재구매 없음
        '409':
          description: 대기 상태 아님
