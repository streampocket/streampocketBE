paths:
  /own/admin/reviews:
    get:
      summary: 관리자 — 전체 리뷰 목록 조회
      tags: [OwnAdminReviews]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: categoryId
          schema: { type: string, format: uuid }
        - in: query
          name: rating
          schema: { type: integer, minimum: 1, maximum: 5 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: 리뷰 목록 (페이지네이션) }
        '401': { description: 인증 필요 }

  /own/admin/reviews/{id}:
    delete:
      summary: 관리자 — 리뷰 영구 삭제 (DB + S3 이미지)
      tags: [OwnAdminReviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 삭제 완료 }
        '401': { description: 인증 필요 }
        '404': { description: 리뷰 없음 }
