paths:
  /own/admin/users/signup-stats:
    get:
      summary: 가입자 수 (오늘 + 조회 기간)
      description: |
        방문자 통계 화면의 "가입" 카드용. 경계는 전부 **KST**다.

        **탈퇴 회원도 센다.** "그날 가입했다"는 사실은 나중에 탈퇴해도 변하지 않고,
        빼면 어제 숫자가 오늘 줄어드는 지표가 된다.

        > 한계: 탈퇴 후 완전 삭제(`purgeWithdrawnUsers`)가 돌면 행 자체가 사라져
        > **과거 기간 합계가 줄어들 수 있다.** 오늘 숫자에는 영향이 없다(유예 후 삭제).

        OTTALL 전용이다. 지코인은 회원가입 기능 자체가 없다(휴대폰 인증 기반 비회원 주문).
      tags: [OwnAdminUsers]
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, example: '2026-07-03' }, description: 'YYYY-MM-DD (KST)' }
        - { in: query, name: to, required: true, schema: { type: string, example: '2026-08-01' }, description: 'YYYY-MM-DD (KST). from보다 빠를 수 없다' }
      responses:
        '200':
          description: 가입자 수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          from: { type: string, example: '2026-07-03' }
                          to: { type: string, example: '2026-08-01' }
                      today: { type: integer, example: 31, description: KST 오늘 하루 가입 수 (조회 기간과 무관) }
                      rangeTotal: { type: integer, example: 142, description: from~to 가입 수 }
        '400': { description: 날짜 형식 오류 · 시작일이 종료일보다 늦음 }
        '401': { description: 인증 필요 }

  /own/admin/users:
    get:
      summary: 회원 목록 조회
      tags: [OwnAdminUsers]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: 이메일/이름/전화번호 통합 검색
        - in: query
          name: provider
          schema:
            type: string
            enum: [local, kakao, google]
          description: 가입 방식 필터
        - in: query
          name: status
          schema:
            type: string
            enum: [active, withdrawn]
            default: active
          description: 활성/탈퇴 회원 필터. withdrawn은 탈퇴일 역순, 원본 연락처(originalEmail/originalPhone)로 검색
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 회원 목록 (페이지네이션)

  /own/admin/users/{id}:
    get:
      summary: 회원 상세 조회
      tags: [OwnAdminUsers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 회원 상세 정보 (파트너, 파티, 결제, 통계, 탈퇴 정보 포함)
        '404':
          description: 회원을 찾을 수 없음

  /own/admin/users/{id}/withdraw:
    post:
      summary: 회원 강제 탈퇴 (관리자)
      description: >
        셀프 탈퇴와 동일한 흐름(30일 보관 후 완전 삭제, 익명화)으로 처리.
        withdrawalReason에 "관리자 처리:" 접두사, withdrawnByAdmin=true 기록.
        진행 중/대기중 파티가 있으면 409.
      tags: [OwnAdminUsers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: 탈퇴 처리 사유 (필수)
      responses:
        '200':
          description: 탈퇴 처리 완료
        '404':
          description: 회원을 찾을 수 없음
        '409':
          description: 진행 중/대기중 파티가 있어 처리 불가, 또는 이미 탈퇴 처리됨
