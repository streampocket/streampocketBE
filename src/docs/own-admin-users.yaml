paths:
  /own/admin/users:
    get:
      summary: 회원 목록 조회
      tags: [OwnAdminUsers]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: 이메일/이름/전화번호 통합 검색
        - in: query
          name: provider
          schema:
            type: string
            enum: [local, kakao, google]
          description: 가입 방식 필터
        - in: query
          name: status
          schema:
            type: string
            enum: [active, withdrawn]
            default: active
          description: 활성/탈퇴 회원 필터. withdrawn은 탈퇴일 역순, 원본 연락처(originalEmail/originalPhone)로 검색
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 회원 목록 (페이지네이션)

  /own/admin/users/{id}:
    get:
      summary: 회원 상세 조회
      tags: [OwnAdminUsers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 회원 상세 정보 (파트너, 파티, 결제, 통계, 탈퇴 정보 포함)
        '404':
          description: 회원을 찾을 수 없음

  /own/admin/users/{id}/withdraw:
    post:
      summary: 회원 강제 탈퇴 (관리자)
      description: >
        셀프 탈퇴와 동일한 흐름(30일 보관 후 완전 삭제, 익명화)으로 처리.
        withdrawalReason에 "관리자 처리:" 접두사, withdrawnByAdmin=true 기록.
        진행 중/대기중 파티가 있으면 409.
      tags: [OwnAdminUsers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: 탈퇴 처리 사유 (필수)
      responses:
        '200':
          description: 탈퇴 처리 완료
        '404':
          description: 회원을 찾을 수 없음
        '409':
          description: 진행 중/대기중 파티가 있어 처리 불가, 또는 이미 탈퇴 처리됨
