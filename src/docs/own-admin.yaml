paths:
  # ───────────────────────── 카테고리 관리 ─────────────────────────
  /own/admin/categories:
    get:
      summary: 카테고리 목록 조회
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 카테고리 목록
    post:
      summary: 카테고리 생성
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                sortOrder:
                  type: integer
      responses:
        '201':
          description: 생성 성공

  /own/admin/categories/{id}:
    patch:
      summary: 카테고리 수정
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sortOrder:
                  type: integer
      responses:
        '200':
          description: 수정 성공
    delete:
      summary: 카테고리 삭제
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 삭제 성공

  # ───────────────────────── 파티 규칙 템플릿 관리 ─────────────────────────
  /own/admin/rule-templates:
    get:
      summary: 파티 규칙 템플릿 목록 조회
      tags: [OwnAdminRuleTemplates]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 규칙 템플릿 목록 (createdAt 오름차순)
    post:
      summary: 파티 규칙 템플릿 생성
      tags: [OwnAdminRuleTemplates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: 생성 성공
        '409':
          description: 이미 존재하는 템플릿 이름

  /own/admin/rule-templates/{id}:
    patch:
      summary: 파티 규칙 템플릿 수정
      tags: [OwnAdminRuleTemplates]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: 수정 성공
        '404':
          description: 템플릿을 찾을 수 없음
        '409':
          description: 이미 존재하는 템플릿 이름
    delete:
      summary: 파티 규칙 템플릿 삭제
      tags: [OwnAdminRuleTemplates]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 삭제 성공
        '404':
          description: 템플릿을 찾을 수 없음

  # ───────────────────────── 파티 관리 ─────────────────────────
  /own/admin/products:
    get:
      summary: 전체 파티 목록 조회
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 전체 파티 목록
    post:
      summary: 파티 생성 (관리자 전용)
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, durationDays, price, totalSlots, leaderName]
              properties:
                name:
                  type: string
                durationDays:
                  type: integer
                price:
                  type: integer
                dailyDiscount:
                  type: integer
                totalSlots:
                  type: integer
                imagePath:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                leaderName:
                  type: string
                  description: 파티장 표시 이름 (관리자가 직접 입력)
      responses:
        '201':
          description: 생성 성공

  /own/admin/products/{id}/duplicate:
    post:
      summary: 동일 파티 복제 생성 (관리자 전용)
      description: |
        원본 파티의 설정 필드(이름·기간·가격·일일할인·정원·파티종류·기간모드·이미지·규칙·파티장)를
        전부 복사해 새 파티를 생성한다. 모집 상태는 초기화(모집중, 인원 0, 시작일 없음).
        파티가 정원을 채워 모집완료된 직후 "똑같은 파티 재생성" 확인에서 호출된다.
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 복제 생성 성공 — data에 새 파티
        '404':
          description: 원본 파티 없음(삭제 포함)

  /own/admin/products/{id}:
    get:
      summary: 파티 상세 조회
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 파티 상세
        '404':
          description: 파티 없음
    patch:
      summary: 파티 수정
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 수정 성공
    delete:
      summary: 파티 삭제
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 삭제 성공

  /own/admin/products/{id}/status:
    patch:
      summary: 파티 상태 변경
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 상태 변경 완료
