paths:
  # ───────────────────────── 카테고리 관리 ─────────────────────────
  /own/admin/categories:
    get:
      summary: 카테고리 목록 조회
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 카테고리 목록
    post:
      summary: 카테고리 생성
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                sortOrder:
                  type: integer
      responses:
        '201':
          description: 생성 성공

  /own/admin/categories/{id}:
    patch:
      summary: 카테고리 수정
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sortOrder:
                  type: integer
      responses:
        '200':
          description: 수정 성공
    delete:
      summary: 카테고리 삭제
      tags: [OwnAdminCategories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 삭제 성공

  # ───────────────────────── 파티 관리 ─────────────────────────
  /own/admin/products:
    get:
      summary: 전체 파티 목록 조회
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 전체 파티 목록
    post:
      summary: 파티 생성 (관리자 전용)
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, durationDays, price, totalSlots, leaderName]
              properties:
                name:
                  type: string
                durationDays:
                  type: integer
                price:
                  type: integer
                dailyDiscount:
                  type: integer
                totalSlots:
                  type: integer
                imagePath:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                accountId:
                  type: string
                  nullable: true
                accountPassword:
                  type: string
                  nullable: true
                leaderName:
                  type: string
                  description: 파티장 표시 이름 (관리자가 직접 입력)
      responses:
        '201':
          description: 생성 성공

  /own/admin/products/{id}:
    get:
      summary: 파티 상세 조회
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 파티 상세
        '404':
          description: 파티 없음
    patch:
      summary: 파티 수정
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 수정 성공
    delete:
      summary: 파티 삭제
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 삭제 성공

  /own/admin/products/{id}/credentials:
    get:
      summary: 파티 OTT 계정 정보 조회
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 복호화된 계정 정보

  /own/admin/products/{id}/status:
    patch:
      summary: 파티 상태 변경
      tags: [OwnAdminProducts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 상태 변경 완료
