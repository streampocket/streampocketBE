paths:
  /own/products:
    get:
      summary: 파티 목록 조회 (공개)
      description: 정렬 규칙 — 참여자 있는 파티(filledSlots > 0)를 먼저, 같은 그룹 내에서는 오래된 순(createdAt 오름차순).
      tags: [OwnProducts]
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
          description: 카테고리 ID로 필터링
        - in: query
          name: status
          schema:
            type: string
            enum: [recruiting, closed, expired]
          description: 상태로 필터링
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: 결과 개수 제한
      responses:
        '200':
          description: 공개 파티 목록

  /own/products/{id}:
    get:
      summary: 파티 상세 조회 (공개)
      tags: [OwnProducts]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 파티 상세
        '404':
          description: 파티 없음

  /own/products/{id}/apply:
    post:
      summary: 파티 참여 신청
      description: |
        참여 신청을 만든다. 이미 대기·확정 중이면 409.

        **포인트는 사용 여부(`usePoint`)만 받고 금액은 서버가 정한다** —
        `min(보유 잔액, 총액)`. 클라이언트가 보낸 금액을 신뢰하면 조작 여지가 생긴다.
        차감은 신청 생성과 **같은 트랜잭션**에서 이뤄지고, 잔액이 충분할 때만 깎이는
        조건부 갱신이라 동시에 신청해도 잔액이 음수가 되지 않는다.

        재신청(대기 상태에서 다시 신청)이면 **이전 차감분을 먼저 반환한 뒤** 새로 차감한다.
      tags: [OwnProducts]
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                usePoint:
                  type: boolean
                  default: false
                  description: 보유 포인트를 쓸지 여부. 금액은 서버가 정한다
      responses:
        '201':
          description: 신청 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      applicationId: { type: string, format: uuid }
                      price: { type: integer, description: 신청 시점 파티 가격(차감형이면 할인 반영) }
                      fee: { type: integer, example: 300 }
                      totalAmount: { type: integer, description: price + fee }
                      usedPoint: { type: integer, description: 서버가 정한 실제 사용액 }
                      payableAmount: { type: integer, description: totalAmount - usedPoint }
        '400': { description: 참여 불가 (모집 마감 · 잔여 기간 1일 이하 등) }
        '401': { description: 인증 필요 }
        '409': { description: 이미 신청 중 · 모집 마감 · 보유 포인트 부족(동시 사용) }

  /own/categories:
    get:
      summary: 카테고리 목록 조회 (공개)
      tags: [OwnProducts]
      responses:
        '200':
          description: 카테고리 목록
