paths:
  /own/products:
    get:
      summary: 파티 목록 조회 (공개)
      tags: [OwnProducts]
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
          description: 카테고리 ID로 필터링
        - in: query
          name: status
          schema:
            type: string
            enum: [recruiting, closed, expired]
          description: 상태로 필터링
        - in: query
          name: sort
          schema:
            type: string
            enum: [latest, urgency]
          description: 정렬 기준 (urgency = 잔여 슬롯 적은 순)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: 결과 개수 제한
      responses:
        '200':
          description: 공개 파티 목록

  /own/products/{id}:
    get:
      summary: 파티 상세 조회 (공개)
      tags: [OwnProducts]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 파티 상세
        '404':
          description: 파티 없음

  /own/categories:
    get:
      summary: 카테고리 목록 조회 (공개)
      tags: [OwnProducts]
      responses:
        '200':
          description: 카테고리 목록
