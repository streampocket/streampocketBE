paths:
  /own/reviews:
    get:
      summary: 리뷰 목록 조회 (공개)
      tags: [OwnReviews]
      parameters:
        - in: query
          name: productId
          schema: { type: string, format: uuid }
        - in: query
          name: categoryId
          schema: { type: string, format: uuid }
        - in: query
          name: sort
          schema: { type: string, enum: [latest, rating], default: latest }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        '200':
          description: 리뷰 목록 (페이지네이션)

    post:
      summary: 리뷰 작성 (참여 확정 회원만)
      tags: [OwnReviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, content, rating]
              properties:
                applicationId: { type: string, format: uuid }
                content: { type: string, minLength: 1, maxLength: 2000 }
                rating: { type: integer, minimum: 1, maximum: 5 }
                imageUrl:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '201': { description: 리뷰 생성됨 }
        '401': { description: 인증 필요 }
        '403': { description: 본인 신청 아님 또는 확정 상태 아님 }
        '404': { description: 신청 내역 없음 }
        '409': { description: 이미 이 파티에 작성한 리뷰 존재 }

  /own/reviews/{id}:
    get:
      summary: 리뷰 단건 조회 (공개)
      tags: [OwnReviews]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 리뷰 상세 }
        '404': { description: 리뷰 없음 }

    patch:
      summary: 리뷰 수정 (작성자만)
      tags: [OwnReviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, rating]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
                rating: { type: integer, minimum: 1, maximum: 5 }
                imageUrl:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '200': { description: 수정된 리뷰 }
        '401': { description: 인증 필요 }
        '403': { description: 작성자 아님 }
        '404': { description: 리뷰 없음 }

  /own/reviews/eligible:
    get:
      summary: 내가 리뷰 작성 가능한 파티 목록 (status=confirmed && 리뷰 미작성)
      tags: [OwnReviews]
      security:
        - bearerAuth: []
      responses:
        '200': { description: 작성 가능한 파티 신청 목록 }
        '401': { description: 인증 필요 }

  /own/reviews/uploads/presigned-url:
    post:
      summary: 리뷰 이미지 업로드용 S3 Presigned URL 발급
      tags: [OwnReviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentLength]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                contentLength:
                  type: integer
                  minimum: 1
                  maximum: 5242880
                  description: 바이트 단위 파일 크기 (최대 5MB)
      responses:
        '200':
          description: |
            { uploadUrl, objectUrl, key } 반환.
            uploadUrl로 60초 이내에 PUT 요청해서 S3에 직접 업로드.
            업로드 성공 시 objectUrl을 리뷰 생성/수정 시 imageUrl로 전달.
        '400': { description: 허용되지 않은 형식 또는 용량 초과 }
        '401': { description: 인증 필요 }
