paths:
  /steam/admin/accounts:
    get:
      summary: 계정 목록 조회
      tags: [SteamAccounts]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: gameId
          description: 게임 필터 — 과거 계정(productId만 기록)도 OR 폴백으로 함께 조회
          schema:
            type: string
        - in: query
          name: productId
          description: 레거시 상품 필터 (과도기 호환)
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [available, reserved, sent, disabled]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 계정 목록

  /steam/admin/accounts/bulk:
    post:
      summary: 계정 일괄 등록
      tags: [SteamAccounts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accounts]
              properties:
                gameId:
                  type: string
                  description: 게임 id (NA·BG만 등록 가능 — AA는 400)
                productId:
                  type: string
                  description: 레거시 상품 id (과도기 호환 — gameId 미지정 시 게임 id로 해석)
                accounts:
                  type: array
                  items:
                    type: object
                    required: [username, password]
                    properties:
                      username:
                        type: string
                        example: steam_user123
                      password:
                        type: string
                        example: P@ssw0rd!
                      email:
                        type: string
                        example: user@gmail.com
                      emailPassword:
                        type: string
                        example: mailpass
                      emailSiteUrl:
                        type: string
                        example: https://gmail.com
                      secondaryEmail:
                        type: string
                        nullable: true
                        description: 2차 이메일 (선택)
                      secondaryEmailPassword:
                        type: string
                        nullable: true
                        description: 2차 이메일 비밀번호 (선택)
      responses:
        '201':
          description: 등록 완료 (등록된 계정 수 반환)
        '400':
          description: gameId 누락 또는 AA 상품
        '404':
          description: 게임 없음

  /steam/admin/accounts/{id}/disable:
    patch:
      summary: 계정 비활성화
      tags: [SteamAccounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 비활성화 완료
        '404':
          description: 계정 없음
