paths:
  /steam/chatbot/registration:
    post:
      summary: 스팀 등록 양식 접수 (카카오 챗봇 스킬)
      description: >-
        카카오 i 오픈빌더 챗봇(폴백 블록)이 호출하는 스킬 엔드포인트. 구매자가 보낸 메시지가
        등록 양식이면 규칙 기반으로 파싱·저장하고 성함+게임명으로 주문 자동매칭을 시도한다.
        양식이 아닌 일반 문의는 저장·알림 없이 상담원 연결(operator) 버튼으로 안내한다.
        응답은 카카오 SkillResponse 2.0 형식. 인증: X-Chatbot-Secret 헤더.
      tags: [SteamChatbot]
      parameters:
        - in: header
          name: X-Chatbot-Secret
          required: true
          description: 챗봇 스킬 시크릿 토큰
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userRequest]
              properties:
                userRequest:
                  type: object
                  required: [utterance, user]
                  properties:
                    utterance:
                      type: string
                      description: 구매자가 보낸 메시지 원문
                    user:
                      type: object
                      required: [id]
                      properties:
                        id:
                          type: string
                          description: 챗봇 사용자 식별값(botUserKey)
      responses:
        '200':
          description: >-
            카카오 SkillResponse 2.0. 등록 양식이면 접수 확인(또는 누락 항목 재전송 안내),
            양식이 아닌 일반 문의면 안내 메시지 + 상담원 연결(operator) 버튼을 반환한다.
          content:
            application/json:
              examples:
                registered:
                  summary: 등록 양식 접수 완료
                  value:
                    version: '2.0'
                    template:
                      outputs:
                        - textCard:
                            text: '✅ 홍길동님, 스팀 등록 양식이 정상 접수되었습니다.'
                            buttons:
                              - action: webLink
                                label: 실시간 진행상황 조회
                                webLinkUrl: https://ottall.com/track
                nonForm:
                  summary: 양식이 아닌 일반 문의 — 상담원 연결
                  value:
                    version: '2.0'
                    template:
                      outputs:
                        - textCard:
                            text: "스팀 등록 양식 접수만 자동으로 처리하고 있어요.\n다른 문의는 상담원이 도와드릴게요. 아래 버튼을 눌러주세요 🙏"
                            buttons:
                              - action: operator
                                label: 상담원 연결
        '401':
          description: 시크릿 불일치

  /steam/chatbot/welcome:
    post:
      summary: 챗봇 웰컴 응답 (카카오 챗봇 스킬)
      description: >-
        오픈빌더 웰컴 블록이 호출하는 스킬 엔드포인트. 웰컴 인사말(simpleText)과
        활성 챗봇 메뉴 항목을 quickReplies로 반환한다. 인증: X-Chatbot-Secret 헤더.
      tags: [SteamChatbot]
      parameters:
        - in: header
          name: X-Chatbot-Secret
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 카카오 SkillResponse 2.0 (인사말 + 메뉴 quickReplies)
        '401':
          description: 시크릿 불일치

  /steam/chatbot/registration/answer:
    post:
      summary: 누락 항목 되묻기 답변 처리 (카카오 챗봇 스킬)
      description: >-
        멀티턴 되묻기에서 구매자가 보낸 답변을 처리한다. botUserKey로 진행 중(needs_info) 접수를 찾아
        첫 번째 누락 항목을 채우고, 남은 누락이 있으면 다시 되묻고 없으면 접수 완료 응답을 반환한다.
        인증: X-Chatbot-Secret 헤더.
      tags: [SteamChatbot]
      parameters:
        - in: header
          name: X-Chatbot-Secret
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userRequest]
              properties:
                userRequest:
                  type: object
                  required: [utterance, user]
                  properties:
                    utterance:
                      type: string
                      description: 누락 항목에 대한 구매자 답변
                    user:
                      type: object
                      required: [id]
                      properties:
                        id:
                          type: string
      responses:
        '200':
          description: 카카오 SkillResponse 2.0
        '401':
          description: 시크릿 불일치
