paths:
  /steam/cron/poll:
    post:
      summary: 네이버 주문 폴링 수동 실행
      tags: [SteamCron]
      responses:
        '200':
          description: 폴링 완료

  /steam/cron/backup-scan:
    post:
      summary: 네이버 주문 보조 스캔 (PAYED 상태 기반)
      description: 최근 6시간 내 PAYED 상태 주문 전체를 조회하여 누락된 주문을 자동 처리한다. 멱등 가드로 중복 처리 방지.
      tags: [SteamCron]
      responses:
        '200':
          description: 보조 스캔 완료

  /steam/cron/daily-reconcile:
    post:
      summary: 어제 주문 누락 대조 알람
      description: 네이버에서 어제 결제된 주문 전체 vs DB 어제 주문을 비교하여 차이가 있으면 Discord에 경고만 발송 (자동 처리 X).
      tags: [SteamCron]
      responses:
        '200':
          description: 대조 완료

  /steam/cron/zqbg-poll:
    post:
      summary: zqbg 발송상태 폴링 수동 실행 (AA 선물주문 자동완료)
      description: |
        진행중(in_progress) + giftCode(zqbg 주문번호) 보유 AA 주문을 zqbg.cn 발송상태 조회 API로 점검하여,
        발송완료(status 6)면 자동으로 완료 처리하고 완료 알림톡을 발송한다. status 5/7은 진행중 유지,
        미지정 status·장시간 미완료는 Discord 알림 후 진행중 유지. 자동 스케줄러(기본 5분)와 동일 로직의 수동 트리거.
      tags: [SteamCron]
      responses:
        '200':
          description: 폴링 완료 (checked/completed/pending/abnormal/failed/skipped 반환)

  /steam/cron/auto-extend-check:
    post:
      summary: 진행중 주문 예상 완료시각 자동 +10분 연장 점검 (매 1분 자동 실행, 수동 트리거용)
      description: |
        진행중(in_progress) + estimatedCompletedAt ≤ now+2분 + autoExtendCount < 5 조건을 만족하는 주문을
        모두 자동으로 +10분 연장하고, 주문당 Discord `auto_extend` 채널에 알림(상품명·수신자명·상품주문번호·횟수 N/5) 발송.
        주문당 최대 5회까지만 자동 연장된다(총 +50분). 수동 +10분 버튼은 본 카운터와 무관하게 동작.
      tags: [SteamCron]
      responses:
        '200':
          description: 점검 완료 (scanned/extended/skipped 반환)

  /steam/cron/weekly-settlement:
    post:
      summary: 주간 정산 실행
      tags: [SteamCron]
      responses:
        '200':
          description: 주간 정산 완료

  /steam/cron/expire-parties:
    post:
      summary: 만료된 파티 자동 상태 전환
      description: startedAt + durationDays가 현재 시각을 초과한 closed 파티를 expired로 변경
      tags: [SteamCron]
      responses:
        '200':
          description: 만료 처리 완료 (expiredCount 반환)

  /steam/cron/purge-withdrawn-users:
    post:
      summary: 탈퇴 회원 완전 삭제 (매일 00:00 KST 자동 실행, 수동 트리거용)
      description: >
        탈퇴(deletedAt) 후 30일이 지난 회원을 하드 삭제한다.
        약관동의는 Cascade 삭제, 파티 신청/리뷰/커뮤니티 글은 userId null(익명)로 보존.
      tags: [SteamCron]
      responses:
        '200':
          description: 완전 삭제 처리 완료 (purged/failed 카운트 반환)

  /steam/cron/daily-sales-report:
    post:
      summary: 일일 종합 리포트 Discord 전송 (매일 23:59 KST 자동 실행, 수동 트리거용)
      description: |
        오늘(KST) 기준으로 다음을 한 메시지에 모아 Discord `expense` 채널로 발송한다.
        - 주문/구매확정/반품 카운트
        - 네이버 매출 + 수수료(6.6%)
        - 수동 주문 내역 (source='manual', paidAt 오늘, 반품 제외) + 소계
        - 비용 내역 (분류·결제자 표시) + 결제자별 합계
        - 순수익 = 네이버 매출 − 수수료 − 비용 (수동 주문 매출은 순수익에 합산하지 않음)
        - 분담 정산: 분담 대상 = max(비용 − 수동 매출, 0). 인당 부담 = 분담 대상 / 2.
          정산액 = (송동건 결제 − 임정빈 결제) / 2 (부호로 송금 방향 결정).
      tags: [SteamCron]
      responses:
        '200':
          description: 일일 종합 리포트 전송 완료
