paths:
  /steam/admin/dashboard/stats:
    get:
      summary: 대시보드 통계 조회
      tags: [SteamDashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          description: 매출 집계 기간 (기본 today)
          schema:
            type: string
            enum: [today, week, month, all]
            default: today
        - in: query
          name: store
          description: 스토어 필터 (미지정 시 전체=공통 포함, 지정 시 해당 store만=공통 제외)
          schema:
            type: string
            enum: [streampocket, pokemon_steam]
      responses:
        '200':
          description: 주문 카드 통계 + 매출 요약 (store별 분리)
  /steam/admin/dashboard/revenue-calendar:
    get:
      summary: 월 캘린더용 일별 매출/순수익 조회
      description: 해당 월 1일~말일의 일별 매출·순수익 배열. 순수익 공식은 대시보드 매출 요약과 동일 (네이버 정산금 + 수동매출 + 수동/파티/배그 순수익 − 비용). hasMemo로 일일 메모 존재 여부 포함.
      tags: [SteamDashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: yearMonth
          required: true
          description: 조회 월 (YYYY-MM)
          schema:
            type: string
            example: '2026-07'
        - in: query
          name: store
          description: 스토어 필터 (미지정 시 전체=공통 포함, 지정 시 해당 store만=공통 제외)
          schema:
            type: string
            enum: [streampocket, pokemon_steam]
      responses:
        '200':
          description: 일별 { date, totalRevenue, netProfit, hasMemo } 배열
  /steam/admin/dashboard/daily-report:
    get:
      summary: 일일 종합 리포트 조회
      description: 디스코드 23:59 일일 리포트와 같은 빌더를 사용한 당일 집계 데이터 (항상 전사 기준, 일일 메모 포함).
      tags: [SteamDashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: true
          description: 조회 날짜 (YYYY-MM-DD, KST)
          schema:
            type: string
            example: '2026-07-18'
      responses:
        '200':
          description: 주문 건수/네이버 매출·수수료/수동·파티·배그 주문/수동매출/비용/순수익/분담 정산/메모
  /steam/admin/dashboard/daily-memo:
    put:
      summary: 일일 메모 저장
      description: 날짜당 1개(전사 기준) 메모 upsert. content를 빈 문자열로 보내면 삭제된다.
      tags: [SteamDashboard]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, content]
              properties:
                date:
                  type: string
                  example: '2026-07-18'
                content:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: 저장 결과 { memo } (삭제 시 null)
  /steam/admin/dashboard/extras:
    get:
      summary: 상품 랭킹 + 평균 구매확정일 조회
      tags: [SteamDashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: store
          description: 스토어 필터 (미지정 시 전체)
          schema:
            type: string
            enum: [streampocket, pokemon_steam]
      responses:
        '200':
          description: 상품별 판매 랭킹과 평균 구매확정 소요일
