paths:
  /steam/admin/games:
    get:
      summary: 게임 목록 조회 (스토어별 리스팅 + 공유 재고)
      tags: [SteamGames]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: store
          description: 스토어 필터 (미지정 시 전체)
          schema:
            type: string
            enum: [streampocket, pokemon_steam]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: |
            게임 목록. 각 게임은 productType, stockCount(가용 재고),
            listings[](스토어별 가격·네이버ID·상태)을 포함.
            응답: data, total, page, pageSize, totalPages, counts(total/streampocket/pokemon_steam)
        '401':
          description: 인증 필요
  /steam/admin/games/options:
    get:
      summary: 게임 옵션 목록 (드롭다운용, 비페이징)
      description: |
        계정관리 등록/필터 등 드롭다운에서 쓰는 경량 목록.
        productTypes 쉼표 구분 필터 (예: NA,BG). 미지정 시 전체.
      tags: [SteamGames]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: productTypes
          description: 쉼표 구분 상품 타입 필터 (NA,AA,BG 조합)
          schema:
            type: string
            example: NA,BG
      responses:
        '200':
          description: data[] — id, name, productType (이름 오름차순)
        '401':
          description: 인증 필요
  /steam/admin/games/sync:
    post:
      summary: 네이버 상품 동기화 (스토어별 또는 전체)
      description: |
        store 지정 시 해당 스토어만, 미지정 시 전체 스토어를 스토어별 오류 격리로 동기화한다.
        스트림포켓은 레거시 SteamProduct 도 함께 유지(주문 처리 호환).
      tags: [SteamGames]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: store
          schema:
            type: string
            enum: [streampocket, pokemon_steam]
      responses:
        '200':
          description: 스토어별 동기화 결과 배열 (created/updated/deleted/gamesCreated 또는 error)
        '401':
          description: 인증 필요
  /steam/admin/games/listings/{id}/merge:
    patch:
      summary: 리스팅을 다른 게임으로 재연결 (수동 병합)
      tags: [SteamGames]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: 리스팅 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameId]
              properties:
                gameId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: 재연결된 리스팅
        '404':
          description: 리스팅 또는 대상 게임 없음
        '409':
          description: 대상 게임에 이미 해당 스토어 리스팅 존재
