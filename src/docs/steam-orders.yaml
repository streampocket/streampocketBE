paths:
  /steam/admin/orders:
    get:
      summary: 주문 목록 조회
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, purchase_decided, manual_review, failed, returned]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: source
          description: 출처 필터 (미지정 시 네이버+수동 전체)
          schema:
            type: string
            enum: [naver, manual]
        - in: query
          name: store
          description: 스토어 필터 (미지정 시 전체)
          schema:
            type: string
            enum: [streampocket, pokemon_steam]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 주문 목록

  /steam/admin/orders/manual:
    post:
      summary: 수동 주문 생성
      description: >-
        네이버 외 경로로 발생한 주문을 관리자가 직접 등록한다. 상품주문번호는 서버가
        `MAN_<타임스탬프>_<랜덤>` 형식으로 자동생성하며(네이버 번호와 충돌 없음),
        상태는 `pending`(대기), 결제일시는 생성 시각으로 자동 설정된다(이후 상세 모달에서 변경).
        입력한 순수익(`netProfit`)은 `unitPrice`/`paymentAmount`/`settlementAmount`에
        동일 저장되어 매출 순수익·인당 수익에 반영된다. `source`는 `manual`로 저장된다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productName, receiverName, netProfit]
              properties:
                productName:
                  type: string
                  maxLength: 255
                receiverName:
                  type: string
                  maxLength: 100
                netProfit:
                  type: integer
                  minimum: 0
                  description: 순수익(원)
      responses:
        '201':
          description: 생성된 수동 주문
        '400':
          description: 입력값 검증 실패

  /steam/admin/orders/{id}:
    get:
      summary: 주문 상세 조회
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 주문 상세 (발송 이력 포함)
        '404':
          description: 주문 없음
    delete:
      summary: 수동 주문 삭제
      description: >-
        `source='manual'`인 주문만 삭제할 수 있다(네이버 자동 주문은 400 차단).
        삭제는 hard delete이며, 연결된 `DeliveryLog`는 Cascade로 함께 제거된다.
        연결된 `SteamRegistration`이 있다면 `order_item_id`만 NULL로 풀린다(행은 보존).
        지출(`Expense`)이 연결돼 있으면 409로 차단되므로, 먼저 지출 관리에서 연결을 해제하거나 지출을 삭제해야 한다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 삭제 완료
        '400':
          description: 수동 주문이 아님
        '404':
          description: 주문 없음
        '409':
          description: 지출이 연결된 주문

  /steam/admin/orders/{id}/retry:
    post:
      summary: 실패/수동검토 주문 재시도
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 재시도 완료
        '400':
          description: 재시도 불가 상태
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/in-progress:
    post:
      summary: 대기 상태 주문 진행중 전환
      description: >-
        `pending` 상태 주문을 `in_progress`(진행중)로 전환한다. 구매자 진행상황 페이지에 2단계로 표시된다.
        전역 설정(`/steam/admin/settings`)의 기본 소요시간을 읽어 `estimatedCompletedAt`(예상 완료시각)을 함께 저장한다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 진행중으로 전환됨
        '400':
          description: pending 상태가 아님
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/sync-naver-status:
    post:
      summary: 네이버 상태 수동 재조회 (양방향 클레임 동기화)
      description: >-
        해당 주문 1건의 네이버 실제 상태를 조회해 DB와 양방향 동기화한다.
        ① DB가 정상인데 네이버에 반품/취소 클레임이 진행 중이거나 취소·반품 확정 상태면 `returned`로 전환,
        ② DB가 `returned`인데 네이버는 정상이고 진행 중 클레임이 없으면 원래 상태로 복귀
        (네이버 구매확정이면 `purchase_decided`, 발송완료 기록 보유 시 `completed`, 그 외 `pending`),
        ③ 그 외에는 변경 없이 네이버 현재 상태만 반환한다.
        판정 기준은 자동 폴링/보조 스캔과 동일하다. 네이버 주문(`source=naver`)만 가능.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 동기화 결과 (message + data.action = returned/recovered/none)
        '400':
          description: 네이버 주문이 아님
        '404':
          description: 주문 없음 또는 네이버에서 조회 불가

  /steam/admin/orders/{id}/extend-time:
    post:
      summary: 진행중 주문 예상 완료시각 10분 연장
      description: '`in_progress` 상태 주문의 `estimatedCompletedAt`을 10분 뒤로 미룬다.'
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 예상 완료시각 10분 연장됨
        '400':
          description: in_progress 상태가 아니거나 예상 완료시각 미설정
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/complete:
    post:
      summary: 주문 수동 완료 처리
      description: >-
        운영자가 발송완료를 확인하고 `completedAt`(발송완료 시각)을 기록한다.
        `pending`/`in_progress` 주문은 `completed`로 전환하고, 구매자가 먼저 구매확정한
        `purchase_decided` 주문은 뱃지를 유지한 채 `completedAt`만 기록한다.
        진행사항(track) 페이지는 이 `completedAt` 값으로 완료를 판정한다.
        `pending`/`in_progress` 주문 완료 시 게임선물 완료 알림톡(UH_9664)을 발송한다
        (`purchase_decided`는 미발송, 발송 실패는 완료 처리를 막지 않음).
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 완료 처리됨
        '400':
          description: 이미 완료 처리됨, 또는 pending/in_progress/purchase_decided 상태가 아님
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/purchase-decide:
    post:
      summary: 파티 주문 구매확정 처리
      description: >-
        파티 주문(`source=party`) 전용. 생성 직후 `completed` 상태인 파티 주문을
        순수익 입력 완료 후 `purchase_decided`(구매확정)로 전환하고 `completedAt`을 기록한다.
        순수익(`settlementAmount`)이 0원 이하면 400으로 거부한다.
        외부 연동(네이버 발송/알림톡) 없이 상태 변경만 수행한다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 구매확정 처리됨
        '400':
          description: 파티 주문이 아님, completed 상태가 아님, 또는 순수익 미입력(0원 이하)
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/return:
    post:
      summary: 수동 반품 처리
      description: |
        주문을 반품(returned) 처리한다. **파티 주문(source=party)이면 연결된 파티 신청도 취소되어
        파티원에서 제거되고 모집 인원이 1 줄어든다** (정원 충족으로 닫혔던 파티는 모집중 복귀).
        파티원 제거가 실패해도 **주문 반품은 반드시 수행**되며, 실패 사유는 응답 partyMember로 알린다
        (관리자는 파티관리 화면에서 해당 파티원을 직접 제거하면 된다).
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            반품 처리 완료. 응답 — message,
            partyMember: 비파티 주문이면 null / 파티원 제거 성공 시 released=true와 인원·복귀 정보 /
            실패 시 released=false와 reason(not_linked=구버전 미연결 주문, not_confirmed=확정 상태 아님, failed=처리 오류)
        '400':
          description: 반품 불가 상태 (이미 반품됨)
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/friend-links:
    patch:
      summary: AA 주문 입력 필드 저장
      description: |
        AA(선물형) 주문의 친구 추가 URL 2개, 선물 코드, 게임 URL, 메모, zqbg 자동 조회 여부를 저장한다.
        null 전송 시 해당 필드 삭제. zqbgAutoCheckEnabled(기본 false)를 켠 주문만 zqbg 발송상태 폴링 대상이 된다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                friendLink1:
                  type: string
                  nullable: true
                  maxLength: 500
                friendLink2:
                  type: string
                  nullable: true
                  maxLength: 500
                friendCode:
                  type: string
                  nullable: true
                  maxLength: 20
                  description: 스팀 친구 코드 (계정번호) — 자동 생성 시 함께 저장, 수동 입력 가능
                giftCode:
                  type: string
                  nullable: true
                  maxLength: 200
                gameUrl:
                  type: string
                  nullable: true
                  maxLength: 500
                memo:
                  type: string
                  nullable: true
                  maxLength: 1000
                zqbgAutoCheckEnabled:
                  type: boolean
                  description: zqbg 발송상태 자동 조회 사용 여부 (기본 false — 켠 주문만 폴링)
      responses:
        '200':
          description: 저장 완료
        '400':
          description: AA 주문 아님 또는 URL 형식 오류
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/net-profit:
    patch:
      summary: 수동·파티·배그 주문 순수익 수정 (+수신자명)
      description: >-
        수동(manual)·파티(party)·배그(gcoin) 주문의 순수익을 수정한다. 수수료가 없으므로 생성과 동일하게
        `unitPrice`, `paymentAmount`, `settlementAmount` 세 금액 필드를 모두 동일 값으로 갱신해
        목록(금액)·상세(순수익)·집계(일일 리포트·대시보드)를 일치시킨다. 네이버 주문은 수정할 수 없다.
        receiverName을 함께 보내면 수신자명도 수정된다 (배그 주문 후입력 용도).
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [netProfit]
              properties:
                netProfit:
                  type: integer
                  minimum: 0
                  description: 새 순수익(원). 0 이상의 정수.
                receiverName:
                  type: string
                  maxLength: 100
                  description: 수신자명 (선택 — 보내면 함께 수정)
      responses:
        '200':
          description: 수정 완료
        '400':
          description: 수동 주문 아님 또는 입력값 오류
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/order-status-alimtalk:
    post:
      summary: 주문 진행상황 조회 안내 알림톡 발송
      description: >-
        주문 상세 모달에서 관리자가 고객에게 "주문 진행상황 조회" 알림톡(알리고 템플릿 `UH_9631`)을 수동 발송한다.
        `#{고객명}`, `#{네이버주문번호}` 변수를 치환하며, 발송 결과는 `DeliveryLog`에 기록된다.
        발송 성공 시 `orderStatusAlimtalkSentAt`를 기록해 재발송을 차단하며, 발송 결과(성공·실패)는 Discord로도 알린다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 주문상황 알림톡 발송됨
        '400':
          description: 수신 전화번호 없음 또는 이미 발송한 주문
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/party-otp:
    get:
      summary: 파티 주문 OTP 정보 조회
      description: >-
        파티 주문(source=party)에 연결된 신청의 OTP 상태를 조회한다.
        연결 없으면 linked=false (기능 도입 전 주문). 시크릿 원문/암호문은 절대 응답에 포함하지 않는다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: linked / secretRegistered / secretUpdatedAt / issueCount / maxIssues / logs
        '400':
          description: 파티 주문 아님
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/party-otp/secret:
    post:
      summary: 파티 OTP 시크릿키 등록/재등록
      description: >-
        TOTP 시크릿(Base32)을 AES-256-GCM 암호화하여 저장한다. 재등록해도 발급 횟수는 유지된다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret:
                  type: string
                  description: TOTP 시크릿키 (Base32, 공백 허용)
      responses:
        '200':
          description: 등록 완료
        '400':
          description: 파티 주문 아님 또는 Base32 형식 오류
        '404':
          description: 주문 없음
        '409':
          description: 신청 미연결 주문

  /steam/admin/orders/{id}/party-otp/reset:
    post:
      summary: 파티 OTP 발급 횟수 초기화
      description: 구매자의 발급 횟수를 0으로 초기화한다 (다시 3회 부여). 발급 로그는 보존된다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 초기화 완료
        '400':
          description: 파티 주문 아님
        '404':
          description: 주문 없음
        '409':
          description: 신청 미연결 또는 시크릿 미등록
