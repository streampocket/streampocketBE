paths:
  /steam/admin/orders:
    get:
      summary: 주문 목록 조회
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, purchase_decided, manual_review, failed, returned]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 주문 목록

  /steam/admin/orders/{id}:
    get:
      summary: 주문 상세 조회
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 주문 상세 (발송 이력 포함)
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/retry:
    post:
      summary: 실패/수동검토 주문 재시도
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 재시도 완료
        '400':
          description: 재시도 불가 상태
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/in-progress:
    post:
      summary: 대기 상태 주문 진행중 전환
      description: >-
        `pending` 상태 주문을 `in_progress`(진행중)로 전환한다. 구매자 진행상황 페이지에 2단계로 표시된다.
        전역 설정(`/steam/admin/settings`)의 기본 소요시간을 읽어 `estimatedCompletedAt`(예상 완료시각)을 함께 저장한다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 진행중으로 전환됨
        '400':
          description: pending 상태가 아님
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/extend-time:
    post:
      summary: 진행중 주문 예상 완료시각 10분 연장
      description: '`in_progress` 상태 주문의 `estimatedCompletedAt`을 10분 뒤로 미룬다.'
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 예상 완료시각 10분 연장됨
        '400':
          description: in_progress 상태가 아니거나 예상 완료시각 미설정
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/complete:
    post:
      summary: 주문 수동 완료 처리
      description: >-
        운영자가 발송완료를 확인하고 `completedAt`(발송완료 시각)을 기록한다.
        `pending`/`in_progress` 주문은 `completed`로 전환하고, 구매자가 먼저 구매확정한
        `purchase_decided` 주문은 뱃지를 유지한 채 `completedAt`만 기록한다.
        진행사항(track) 페이지는 이 `completedAt` 값으로 완료를 판정한다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 완료 처리됨
        '400':
          description: 이미 완료 처리됨, 또는 pending/in_progress/purchase_decided 상태가 아님
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/return:
    post:
      summary: 수동 반품 처리
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 반품 처리 완료
        '400':
          description: 반품 불가 상태
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/friend-links:
    patch:
      summary: AA 주문 입력 필드 저장
      description: AA(선물형) 주문의 친구 추가 URL 2개, 선물 코드, 게임 URL, 메모를 저장한다. null 전송 시 해당 필드 삭제.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                friendLink1:
                  type: string
                  nullable: true
                  maxLength: 500
                friendLink2:
                  type: string
                  nullable: true
                  maxLength: 500
                giftCode:
                  type: string
                  nullable: true
                  maxLength: 200
                gameUrl:
                  type: string
                  nullable: true
                  maxLength: 500
                memo:
                  type: string
                  nullable: true
                  maxLength: 1000
      responses:
        '200':
          description: 저장 완료
        '400':
          description: AA 주문 아님 또는 URL 형식 오류
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/gift-complete:
    post:
      summary: AA 주문 선물 접수 완료 처리
      description: AA(선물형) 주문의 `giftCompletedAt` 타임스탬프를 현재 시각으로 기록한다. 1회만 호출 가능.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 선물 접수 완료 처리됨
        '400':
          description: AA 주문 아님 또는 이미 완료된 주문
        '404':
          description: 주문 없음
