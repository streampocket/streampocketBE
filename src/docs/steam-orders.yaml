paths:
  /steam/admin/orders:
    get:
      summary: 주문 목록 조회
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, purchase_decided, manual_review, failed, returned]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: source
          description: 출처 필터 (미지정 시 네이버+수동 전체)
          schema:
            type: string
            enum: [naver, manual]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 주문 목록

  /steam/admin/orders/manual:
    post:
      summary: 수동 주문 생성
      description: >-
        네이버 외 경로로 발생한 주문을 관리자가 직접 등록한다. 상품주문번호는 서버가
        `MAN_<타임스탬프>_<랜덤>` 형식으로 자동생성하며(네이버 번호와 충돌 없음),
        상태는 `pending`(대기), 결제일시는 생성 시각으로 자동 설정된다(이후 상세 모달에서 변경).
        입력한 순수익(`netProfit`)은 `unitPrice`/`paymentAmount`/`settlementAmount`에
        동일 저장되어 매출 순수익·인당 수익에 반영된다. `source`는 `manual`로 저장된다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productName, receiverName, netProfit]
              properties:
                productName:
                  type: string
                  maxLength: 255
                receiverName:
                  type: string
                  maxLength: 100
                netProfit:
                  type: integer
                  minimum: 0
                  description: 순수익(원)
      responses:
        '201':
          description: 생성된 수동 주문
        '400':
          description: 입력값 검증 실패

  /steam/admin/orders/{id}:
    get:
      summary: 주문 상세 조회
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 주문 상세 (발송 이력 포함)
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/retry:
    post:
      summary: 실패/수동검토 주문 재시도
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 재시도 완료
        '400':
          description: 재시도 불가 상태
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/in-progress:
    post:
      summary: 대기 상태 주문 진행중 전환
      description: >-
        `pending` 상태 주문을 `in_progress`(진행중)로 전환한다. 구매자 진행상황 페이지에 2단계로 표시된다.
        전역 설정(`/steam/admin/settings`)의 기본 소요시간을 읽어 `estimatedCompletedAt`(예상 완료시각)을 함께 저장한다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 진행중으로 전환됨
        '400':
          description: pending 상태가 아님
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/extend-time:
    post:
      summary: 진행중 주문 예상 완료시각 10분 연장
      description: '`in_progress` 상태 주문의 `estimatedCompletedAt`을 10분 뒤로 미룬다.'
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 예상 완료시각 10분 연장됨
        '400':
          description: in_progress 상태가 아니거나 예상 완료시각 미설정
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/complete:
    post:
      summary: 주문 수동 완료 처리
      description: >-
        운영자가 발송완료를 확인하고 `completedAt`(발송완료 시각)을 기록한다.
        `pending`/`in_progress` 주문은 `completed`로 전환하고, 구매자가 먼저 구매확정한
        `purchase_decided` 주문은 뱃지를 유지한 채 `completedAt`만 기록한다.
        진행사항(track) 페이지는 이 `completedAt` 값으로 완료를 판정한다.
        `pending`/`in_progress` 주문 완료 시 게임선물 완료 알림톡(UH_9664)을 발송한다
        (`purchase_decided`는 미발송, 발송 실패는 완료 처리를 막지 않음).
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 완료 처리됨
        '400':
          description: 이미 완료 처리됨, 또는 pending/in_progress/purchase_decided 상태가 아님
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/return:
    post:
      summary: 수동 반품 처리
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 반품 처리 완료
        '400':
          description: 반품 불가 상태
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/friend-links:
    patch:
      summary: AA 주문 입력 필드 저장
      description: AA(선물형) 주문의 친구 추가 URL 2개, 선물 코드, 게임 URL, 메모를 저장한다. null 전송 시 해당 필드 삭제.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                friendLink1:
                  type: string
                  nullable: true
                  maxLength: 500
                friendLink2:
                  type: string
                  nullable: true
                  maxLength: 500
                giftCode:
                  type: string
                  nullable: true
                  maxLength: 200
                gameUrl:
                  type: string
                  nullable: true
                  maxLength: 500
                memo:
                  type: string
                  nullable: true
                  maxLength: 1000
      responses:
        '200':
          description: 저장 완료
        '400':
          description: AA 주문 아님 또는 URL 형식 오류
        '404':
          description: 주문 없음

  /steam/admin/orders/{id}/order-status-alimtalk:
    post:
      summary: 주문 진행상황 조회 안내 알림톡 발송
      description: >-
        주문 상세 모달에서 관리자가 고객에게 "주문 진행상황 조회" 알림톡(알리고 템플릿 `UH_9631`)을 수동 발송한다.
        `#{고객명}`, `#{네이버주문번호}` 변수를 치환하며, 발송 결과는 `DeliveryLog`에 기록된다.
        발송 성공 시 `orderStatusAlimtalkSentAt`를 기록해 재발송을 차단하며, 발송 결과(성공·실패)는 Discord로도 알린다.
      tags: [SteamOrders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 주문상황 알림톡 발송됨
        '400':
          description: 수신 전화번호 없음 또는 이미 발송한 주문
        '404':
          description: 주문 없음
