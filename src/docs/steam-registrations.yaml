paths:
  /steam/admin/registrations:
    get:
      summary: 스팀 등록 접수 목록 조회
      description: 챗봇으로 접수된 스팀 등록 정보를 상태·매칭상태로 필터링해 페이지 단위로 조회한다.
      tags: [SteamRegistrations]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [received, needs_info, completed]
        - in: query
          name: matchStatus
          schema:
            type: string
            enum: [unmatched, auto_matched, manual_matched]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 접수 목록 (연결된 주문 정보 포함)

  /steam/admin/registrations/by-order:
    get:
      summary: 주문에 연결된 스팀 등록 접수 조회
      description: 주문 상세 모달용. 해당 주문에 연결된 접수가 없으면 data 는 null.
      tags: [SteamRegistrations]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: orderItemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 연결된 접수 또는 null

  /steam/admin/registrations/{id}:
    get:
      summary: 스팀 등록 접수 상세 조회
      tags: [SteamRegistrations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 접수 상세
        '404':
          description: 접수 없음
    patch:
      summary: 스팀 등록 접수 정보 수정
      description: 파싱된 항목(ID/PW/게임/성함/가드/동의)을 관리자가 수정한다. 필수 항목 누락 목록은 자동 재계산된다.
      tags: [SteamRegistrations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steamId:
                  type: string
                  nullable: true
                steamPassword:
                  type: string
                  nullable: true
                gameName:
                  type: string
                  nullable: true
                buyerName:
                  type: string
                  nullable: true
                steamGuardCodes:
                  type: string
                  nullable: true
                steamGuardDisabled:
                  type: boolean
                  nullable: true
                refundConsent:
                  type: boolean
                adminMemo:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [received, needs_info, completed]
      responses:
        '200':
          description: 수정된 접수
        '404':
          description: 접수 없음

  /steam/admin/registrations/{id}/link:
    post:
      summary: 접수를 주문에 수동 연결
      tags: [SteamRegistrations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderItemId]
              properties:
                orderItemId:
                  type: string
      responses:
        '200':
          description: 연결된 접수
        '404':
          description: 접수 또는 주문 없음

  /steam/admin/registrations/{id}/unlink:
    post:
      summary: 접수의 주문 연결 해제
      tags: [SteamRegistrations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 연결 해제된 접수
        '404':
          description: 접수 없음
