paths:
  /steam/admin/registrations/by-order:
    get:
      summary: 주문에 연결된 스팀 자격증명 조회 (자동 친구링크용)
      description: >-
        주문 상세 모달의 자동 친구링크 폼이 기존에 저장된 스팀 ID/PW/가드 정보를
        프리필하기 위해 호출한다. 연결된 접수가 없으면 data: null 반환.
      tags: [SteamRegistrations]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: orderItemId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 등록 정보 또는 null
        '401':
          description: 인증 실패
