paths:
  /steam/track/{productOrderId}:
    get:
      summary: 주문 진행상황 조회 (구매자용 공개 API)
      description: >-
        네이버 상품주문번호로 주문 진행 단계를 조회한다. 인증 불필요.
        노출 정보는 상품명·진행상태·결제일·갱신일로 최소화되어 있으며 연락처·계정·금액은 포함하지 않는다.
      tags: [SteamTrack]
      parameters:
        - in: path
          name: productOrderId
          required: true
          description: 네이버 상품주문번호
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 진행상황
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      productName:
                        type: string
                      fulfillmentStatus:
                        type: string
                        enum:
                          [
                            pending,
                            in_progress,
                            completed,
                            purchase_decided,
                            manual_review,
                            failed,
                            returned,
                          ]
                      paidAt:
                        type: string
                        format: date-time
                        nullable: true
                      updatedAt:
                        type: string
                        format: date-time
                      returnedAt:
                        type: string
                        format: date-time
                        nullable: true
                      estimatedCompletedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: 진행중(in_progress) 주문의 예상 완료시각. 2단계 카운트다운에 사용.
                      completedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: >-
                          관리자/시스템이 발송완료 처리한 시각. 이 값이 있어야 진행사항이 완료(3단계)로 표시된다.
                          fulfillmentStatus가 purchase_decided여도 이 값이 없으면 진행중으로 표시된다.
                      reviewGameCount:
                        type: integer
                        nullable: true
                        description: >-
                          상품명에서 파싱한 리뷰게임 발송 개수 (예: "게임 1+3" → 3, 포켓몬스팀 "리뷰게임 3개" → 3).
                          패턴이 없으면 null. 완료 화면의 "리뷰 쓰고 게임 N개 받기" 버튼 표시에 사용.
        '404':
          description: 주문 없음 (상품주문번호 불일치)
