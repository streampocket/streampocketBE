components:
  schemas:
    ReviewPointTiers:
      type: object
      description: |
        리뷰 적립 포인트 3구간. **실결제액(총액 − 사용 포인트)** 기준이다.
        총액 기준이면 포인트로 산 건에 또 포인트가 붙어 계속 불어나므로 실결제액을 쓴다.

        구간 개수는 **3으로 고정**이다. 가변으로 두면 추가·삭제·순서·겹침 검증이 붙는데,
        실제 결제액이 두 덩어리로 몰려 있어 잘게 나눌 값어치가 없다.
      properties:
        tier1Max: { type: integer, example: 7000, description: 이 금액 이하 → tier1Point }
        tier2Max: { type: integer, example: 10000, description: 이 금액 이하 → tier2Point }
        tier1Point: { type: integer, example: 100 }
        tier2Point: { type: integer, example: 200 }
        tier3Point: { type: integer, example: 300, description: tier2Max 초과 }
    RenewalDiscount:
      type: object
      description: |
        파티 재구매(기간 연장) 할인 이벤트 — **정액만**.
        켜져 있고 오늘(KST)이 `startDate`~`endDate` 안이면 재구매 정가에서 `amount`원을 뺀다(정가 상한).
        날짜를 비우면(null) 그쪽 경계가 없다 — 둘 다 비우면 켜 둔 동안 계속 적용.
        할인액은 **재구매 요청 시점에 확정 저장**되므로, 설정을 바꿔도 이미 요청한 건은 그대로다.
      properties:
        enabled: { type: boolean, example: true }
        amount: { type: integer, example: 1000, description: 할인 금액(원), 0 이상 }
        startDate: { type: string, nullable: true, example: '2026-10-10', description: 'YYYY-MM-DD (KST), 당일 00:00부터' }
        endDate: { type: string, nullable: true, example: '2026-10-12', description: 'YYYY-MM-DD (KST), 당일 23:59까지' }

paths:
  /steam/admin/settings:
    get:
      summary: 시스템 설정 조회
      description: 전역 기본 소요시간·리뷰 적립 포인트 구간을 조회한다.
      tags: [SystemSettings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 시스템 설정
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      defaultDurationMinutes:
                        type: integer
                        description: 진행중 전환 시 적용되는 전역 기본 소요시간(분)
                        example: 60
                      reviewPointTiers:
                        $ref: '#/components/schemas/ReviewPointTiers'
                      partyAutoAssignEnabled:
                        type: boolean
                        description: 파티 승인 모달의 계정 자동 배정 토글 기본값
                        example: false
                      renewalDiscount:
                        $ref: '#/components/schemas/RenewalDiscount'
    patch:
      summary: 시스템 설정 수정
      description: |
        기본 소요시간(허용 값 20·40·60·90·120분)과 리뷰 적립 구간을 수정한다.
        **두 설정은 화면이 달라 각각 단독으로 보낼 수 있다** — 둘 다 생략하면 400.

        `tier1Max >= tier2Max`면 400. 경계가 뒤집히면 2구간이 영영 지급되지 않는다.
        바꾼 값은 **다음 지급부터** 적용되고 이미 지급된 건은 그대로다.
      tags: [SystemSettings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultDurationMinutes:
                  type: integer
                  enum: [20, 40, 60, 90, 120]
                reviewPointTiers:
                  $ref: '#/components/schemas/ReviewPointTiers'
                partyAutoAssignEnabled:
                  type: boolean
                  description: >-
                    파티 승인 시 계정을 자동 배정할지 여부.
                    설정 화면이 아니라 **신청 승인 모달의 토글**이 단독으로 보낸다
                    (관리자가 마지막에 둔 상태를 다음 승인에도 유지하기 위함).
                renewalDiscount:
                  $ref: '#/components/schemas/RenewalDiscount'
      responses:
        '200':
          description: 수정된 시스템 설정
        '400':
          description: 허용되지 않는 소요시간 · 경계 역전(tier1Max >= tier2Max) · 할인 시작일 > 종료일 · 변경할 설정 없음
